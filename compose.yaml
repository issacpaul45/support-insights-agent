
services:
  db:
    image: postgres:16
    container_name: support-insights-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_insights
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent -d support_insights"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
